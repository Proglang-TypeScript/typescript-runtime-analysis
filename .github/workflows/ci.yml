name: validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixture-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fixture-results
          path: experiments/results
